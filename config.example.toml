# ============================================================
# vulkan_render startup configuration (example)
# ------------------------------------------------------------
# Copy this file to config.toml (in the working directory, or anywhere
# and point to it with --config <path>), then adjust as needed.
#
#   cp config.example.toml config.toml
#   vulkan_render                    # reads config.toml
#   vulkan_render --config my.toml   # reads the given file
#   vulkan_render <model>            # argv overrides the file entries
#
# Note: backslashes are escapes in TOML strings, so use forward slashes
# for Windows paths ("C:/...") or double backslashes ("C:\\...").
# ============================================================

# ---- top level: model to load ----
# model: glTF/GLB file to load. When empty, tries DamagedHelmet.gltf under
#   paths.model_dir, then auto-locates gltf_model/ upward from the cwd.
model = "gltf_model/DamagedHelmet.gltf"

# grid_side: when > 1, lays the first pbr model out as a grid_side x grid_side
#   instanced grid (single instanced draw call stress test; 0 = off)
grid_side = 0

# ---- [paths] resource directories (empty = auto-locate) ----
[paths]
# shaders_dir: shader SPIR-V directory. Empty = find "shaders/" upward from cwd.
shaders_dir = ""

# model_dir: default model directory used when model is empty (looks for
#   DamagedHelmet.gltf inside). Empty = auto-locate "gltf_model/" upward.
model_dir = ""

# screenshot_dir: base directory for F12 screenshots (created on demand).
#   Empty = the current working directory.
screenshot_dir = ""

# ---- [render] window / presentation ----
[render]
# Initial window size in pixels; the window is resizable, resizing rebuilds the
# swapchain automatically.
window_width  = 1080
window_height = 960

# Window title (static; fps is shown in the ImGui overlay when gui is enabled).
window_title = "vulkan_render"

# vsync: true = prefer FIFO_LATEST_READY (vsync-locked, never tears, and the acquire blocks instead of
# spinning, so an idle window stays off the CPU; falls back to FIFO where that extension is missing).
# false = prefer Mailbox, which presents as fast as the app can render: that is the mode to measure
# throughput in, because with vsync the presented rate is the display's refresh rate and only the
# per-pass CPU/GPU timing lines say anything about the renderer.
vsync = true
# max_fps: cap the render loop. 0 = uncapped, which is what a throughput (fps) measurement needs -
# with vsync on the displayed rate is the refresh rate either way, but the loop still runs flat out and
# burns a core, so a desktop build usually wants something like the display's refresh rate here while a
# benchmark wants 0. Capture runs (--capture-frames) also want 0.
max_fps = 0

# clear_color: per-frame background clear color (RGB, 0..1). The lighting stage writes the sky into
#   every pixel no geometry covered, so this only shows where that stage does not run at all.
clear_color = [0.02, 0.02, 0.03]

# camera_fit: how the orbit camera is aimed at the scene when it loads.
#   "exterior" (default) fits the whole model from outside - 2.75 scene radii, which is right for a
#     compact object such as DamagedHelmet.
#   "interior" stands INSIDE the scene and looks along its longest horizontal axis, because that is
#     the axis a hall, nave or corridor runs down (for Sponza: 29.8 x 18.3 in the ground plane, so
#     the look direction ends up +X). The distance is a fraction of the smaller horizontal
#     half-extent, which keeps the eye inside even a narrow hall.
#   A building framed from outside is a facade and nothing else. That is fine for a model viewer and
#   useless for global illumination, where the whole point is to see light bounce around an interior
#   - so use "interior" for Sponza and any other scene you mean to stand in.
#   The startup log prints the pose this resolves to ("initial camera: fit=... yaw ... distance ..."),
#   and --capture-camera pins an exact pose on top of either mode.
camera_fit = "exterior"

# shadow: record the directional shadow pass each frame (false = no shadows, fully lit)
shadow = true

# shadow_cascades: how many cascaded shadow maps the sun uses (1..4). One map cannot be dense enough
# for both the near range and the far one: a single 2048^2 map fitted to a whole scene gives every
# receiver the same texel size, so with the box fitted to the camera view the pixels close to the
# camera get the same coarse texels as the ones far away. The fitted view range is split into this
# many slices (practical split scheme, lambda 0.75), each cascade gets the same map resolution over a
# much smaller footprint, and the fragment shader picks its cascade per pixel from the view depth
# (blending across the boundary over `shadow_cascade_blend` of the range - a hard switch shows the
# resolution step as a line). 1 = exactly the historic single-map behavior; 3 is the default balance,
# 4 spends the sharpest near range on 4x the shadow memory (the map is a 4-layer array whatever this
# says - a runtime-selectable count needs the layers to exist up front). Applied before the scene
# import: the layered image is created when the first scene set binds it.
shadow_cascades = 3

# shadow_map_size: the shadow map's edge length in texels (256..8192, rounded to a power of two).
# 2048 is the default: the layered map is shadow_map_size^2 x 4 cascade layers x 4 bytes per frame
# slot, so 2048 costs 64 MB per slot and 4096 would cost 256 MB - and the depth pass scans that many
# texels per cascade per frame. Halving it quarters both and doubles the shadow texel size (a softer,
# more aliased edge); `[render] shadow_cascades` is usually the better knob to spend resolution on.
# STARTUP-ONLY, like the cascade count: the image, its per-layer views and the descriptor are created
# when the first scene set binds them, so this must apply before the scene import.
shadow_map_size = 2048

# shadow_cascade_blend: fraction of a cascade's range over which it fades into the next one
# (0.1 = the last 10% of the range). 0 = a hard switch.
shadow_cascade_blend = 0.1

# clustered_lights: sort the punctual lights into a screen-tile x depth-slice grid once per frame (a
# compute pass, shaders/light_cluster.comp) and evaluate only the pixel own cluster list instead of
# every active light. This is what makes a light count far past the old four affordable: measured on
# Sponza with 64 procedural lights at 960x720, the shading pass drops from 1.28 ms to 0.44 ms (and the
# same change measured 0.25 ms to 0.08 ms in the pre-M5 forward path), with a byte-identical image.
# false = the brute-force loop over every active light (the reference path the clustered one is
# verified against). The grid is 64 px tiles x 16 exponential depth slices, 32 lights per cluster;
# a cluster that overflows drops the extra lights (raise vulkan::cluster_light_capacity if a scene
# ever needs more - the capacity and the light array size are the two knobs).
clustered_lights = true

# ssao / ssao_radius / ssao_intensity / ssao_samples: screen-space ambient occlusion (M6). The
# lighting stage traces a golden-angle hemisphere of samples around each pixel
# against the G-buffer depth and folds the occlusion into the shade_input ao, which is exactly what a
# material baked AO map does: it scales the IBL ambient (diffuse and specular) and never the direct
# sun. No extra pass and no extra render target - the depth and normals it needs are the G-buffer the
# lighting stage already reads. The radius is in WORLD units, so its apparent strength depends on how
# close the camera is: 0.5 suits human-scale contact AO, while Sponza seen from 50 units away needs
# 1..2 to read (that distance dependence is inherent to screen-space AO, not a tuning mistake), and
# `ssao_samples` trades cost for smoothness (1..16, the shader maximum). `ssao = false` (or an
# intensity of 0) makes the term return exactly 1.0, so the frame is bit for bit the pre-M6 frame.
ssao = true
ssao_radius = 0.5
ssao_intensity = 1.0
ssao_samples = 8

# ssgi / ssgi_intensity / ssgi_radius / ssgi_rays / ssgi_steps / ssgi_spatial_sigma / ssgi_upsample /
# ssgi_ray_tracing / ssgi_bounce:
# screen-space global illumination. `ssgi.comp` traces one bounce of diffuse indirect at HALF
# resolution - each pixel shoots a few cosine-weighted rays, marches the G-buffer depth and averages the
# direct radiance it hits - `ssgi_temporal.comp` then accumulates that trace over frames (reprojected
# with the motion vectors, depth-guarded and neighbourhood-clamped), because two rays per pixel is white
# noise with the right average, and `ssgi_spatial.comp` finally runs a joint-bilateral filter (5x5,
# stopped at depth and normal edges) over the accumulation to remove the grain that does not move, which
# is the part averaging frames cannot touch. The composite then upsamples that half-resolution result to
# the screen, and it does so with a joint-bilateral gather when `ssgi_upsample = true`: a plain bilinear
# fetch mixes in the neighbouring texels by position alone, which at a silhouette means mixing two
# surfaces (or a surface with the background) and shows up as a dark rim on the geometry side and a halo
# on the sky. Setting it to false restores that bilinear fetch, which is what makes the upsample
# measurable - it is not a state to ship. The result is ADDED to the environment probe, not a
# replacement: a ray that leaves the frame hits nothing, so the probe stays the off-screen fallback and
# `ssgi_intensity` reconciles the two (they overlap light, so more is not better - 0.7 is a starting
# point, not a physical value). `ssgi_radius` is a FRACTION of the scene radius, so one value means the
# same thing on a 1.6-unit model and on Sponza's 18.5. `ssgi_rays` x `ssgi_steps` is the per-frame cost;
# the temporal resolve is what turns a small number of rays into a smooth image, so raising `ssgi_rays`
# before the ray budget is spent is usually the wrong lever. `ssgi_spatial_sigma` is the filter's width
# in GI texels (0 = the filter is a pass-through, i.e. the temporal-only result). `ssgi = false` makes
# the frame bit for bit the pre-GI frame (the composite's GI weight is 0 and no GI pass is recorded).
# There are no overlay controls: these are read once at startup, so changing them needs a restart.
ssgi = false
ssgi_intensity = 0.7
ssgi_radius = 0.12
ssgi_rays = 2
ssgi_steps = 6
ssgi_spatial_sigma = 2.0
ssgi_upsample = true
# ssgi_ray_tracing: replace the screen-space march with an inline ray query against the scene's
# acceleration structures. Same estimator and same rays - only the hit oracle changes - so it is still an
# addition to the probe, but it also sees surfaces the depth buffer cannot resolve and its hits are
# exact. Costs nothing when off; on Sponza it roughly doubles the GI pass (0.33 ms marched -> 0.70 ms
# traced at 1080x960) plus the per-frame top level structure work (0.09-0.14 ms). Granted only on a device
# with ray queries and a built acceleration structure, so the key is safe in a shared config file.
ssgi_ray_tracing = false
# ssgi_bounce: how much of the PREVIOUS frame's accumulated indirect a GI ray re-emits at the surface it
# hit - the multi-bounce (Lumen-style) approximation. At 0 a ray carries direct light only, so a corner
# that no light reaches directly stays black; 0.6 picks up the second and third bounce, and the rest
# decays geometrically. It is a feedback loop, so the effective gain is this value TIMES ssgi_intensity,
# because the image that is fed back already carries the intensity: the stable region is a gain at or
# below 1 with an intensity at or below 1, and the runtime clamps the gain there. Raising either one
# inside that region fills an interior in; crossing it makes the frame brighter every frame, which is
# why the knob is measurable (a static camera whose mean luminance must settle) rather than trusted.
ssgi_bounce = 0.0
# ssgi_probes: the world-space probe cache. A grid of cells covering the scene's bounds (a fixed 32^3,
# so a cell is scene-relative), each holding the SH-2 radiance of its surroundings: four coefficients per
# channel, so a cell answers for a DIRECTION - a bright window to its left and a dark wall to its right no
# longer average away. A cell fills itself by TRACING ITS OWN RAYS (four per frame, uniform over the sphere
# because a cell in empty space has no normal, shaded from the geometry they hit through the same hit
# shading the tracer uses, the sky when they hit nothing), so what it holds is a fact about the scene and
# not about the frame the camera happened to show - the pass declares no camera at all. Six axis neighbours
# then blend into it, each gated by a BIDIRECTIONAL test against the surface nearest each cell: a pair that
# cannot see each other drops out of the average instead of being redistributed, which is what keeps the
# blend from having unity DC gain (the version that did add the same fraction of every region's brightness -
# 0.81% of the darkest third, 0.75% of the middle, 0.06% of the brightest - is why that gate exists).
# It exists for the one thing a screen-space chain cannot do: a GI ray that leaves the frame, or that
# hits a surface hidden behind a nearer one, has no cached radiance to read - and the environment probe
# it falls back to is the SKY at infinity, the same value in the middle of a room as on the roof. The
# cache is anchored to the world, so it knows where that ray landed, and it survives the camera turning
# away instead of forgetting what left the frame. It is a cache and not a lighting model: a cell is
# coarse (~1.2 units on Sponza), its visibility test has one surface per cell (a wall neither cell
# recorded can still leak), a cell straddling two surfaces mixes them, and a moving object's light
# stays behind in the grid after it moves. Off is a no-op: the tracer does not even fetch it.
# ssgi_probe_rate: how much of a cell one frame's observation replaces. Small on purpose - this is the
# cache that has to survive the camera turning away - and it is also the loop gain of the grid's own
# cycle (tracer -> resolve -> grid -> tracer), so it is the number that decides whether that settles.
# ssgi_probe_rounds: propagation rounds per frame (0 = injection only, i.e. the cache holds exactly what
# the frame could see; that is also how the propagation's contribution is measured).
# ssgi_probe_gain: how much of the cache's answer is added on top of the environment probe, 0 = the cache
# still runs and is simply never sampled (the A/B that measures what the grid actually adds).
# The SIGN of this value is a second A/B, and it asks a different question: is the cache DIRECTIONAL? A
# negative value means the same gain with the cell looked up along the OPPOSITE direction of the ray - the
# same cell, the other side - and nothing else changes, because the far-field environment term is still
# sampled along the ray itself. So the two captures differ ONLY through the cache, and while a cell holds
# one RGB they are byte-identical BY CONSTRUCTION (measured: same SHA256 at +1 and at -1). That is what
# makes this the acceptance test for the directional-probe step: it fails today and has to pass once a
# cell carries a direction.
#
# WHAT THE CACHE'S CONTRIBUTION IS MADE OF, MEASURED (Sponza interior, traced GI, gain 1 against gain 0,
# rate 0.08, rounds 2, frames 180, in a 4x4 spatial table of the difference as a percentage of each tile's
# own brightness): -0.03% to -0.22% in the sky-facing tiles and -1.5% to -7.5% in the interior ones. The
# effect is ORDERED BY THE SCENE, not by the frame's brightness, which is what a correct cache looks like:
# it replaces the sky estimate where the surface faces interior geometry and leaves it alone where the
# surface really does see the sky.
# (The tertile tables this file used to carry said "ambient-shaped" about an earlier version that ADDED to
# the far-field probe instead of replacing it. A brightness third mixes sky pixels with interior ones, so it
# cannot show a replacement's structure; a spatial table can, which is why the instrument changed. Those
# numbers were right and the lens was wrong.)
# WHAT THE DIRECTIONAL PART IS WORTH, measured with the gain's sign (below): the two captures isolate the
# cache's directional content exactly, and they were byte-identical (same SHA256) before the SH-2 change and
# differ on 22.7% of pixels after it, by up to 14 of 255, in the same 180-frame capture.
ssgi_probes = false
ssgi_probe_rate = 0.08
ssgi_probe_rounds = 2
ssgi_probe_gain = 1.0
# ssgi_hit_shading: shade the surface a GI ray LANDED ON from its own geometry, material and textures,
# instead of reading the screen's direct-radiance image at the pixel it reprojects to. The screen path has
# two structural limits that both come from that reprojection: a hit the camera does not show (off screen,
# or hidden behind a nearer surface) has no pixel to read and falls back to a probe - which approximates
# the light where the RAY STARTED, not radiance arriving from where it landed - and every sample moves with
# the camera, so a surface's indirect light changes when the view does. Shading the hit removes both: the
# answer depends on the hit surface and the lights alone. It costs the vertex, index and texture fetches a
# shaded hit makes (and a shadow ray per hit for the sun, which replaces the cascade lookup), and it needs
# the acceleration structures and the traced GI path - with the marched path, or on a device without ray
# queries, it does nothing. Off is the previous behaviour exactly: hits are read from the screen.
ssgi_hit_shading = false
# furnace: a VERIFICATION mode, not a look. The sun is turned off and the environment becomes a constant
# level, which makes the correct frame computable by hand: a diffuse surface''s outgoing radiance is exactly
# albedo * L, and a bounce has nothing to add because the environment already is the light. So the frame must
# not change when the GI chain is switched on - and if it does, the excess is an energy error rather than a
# matter of taste between two of this project''s own estimators. It exists because every other reference
# available here shares a bias with the model it would be judging. Off by default, and off is byte-exact.
# MEASURED, and its premise is narrower than it first looks: the identity holds when the incident
# radiance is L from EVERY direction, which is true of a convex object and false inside a building - a
# ray that lands on a wall comes back with the wall's radiance, albedo_wall * L, not L. So on a convex
# scene the mode is an exact acceptance test (measured: GI-on and GI-off agree to -0.0001 of mean
# brightness, 122 of 1036800 pixels off by one 8-bit step), while in the Sponza interior the traced
# frame is legitimately darker by the hit population (measured GI-on 125.9436 against GI-off 134.7686,
# -6.5%) - that is the occlusion-corrected ambient the traced chain exists to produce, not an energy
# error. `ssgi_radius = 0` isolates the chain's own arithmetic from the scene: every ray then misses, so
# the chain must be the identity (measured: 2.68% of pixels off by one 8-bit step, max 1).
# The mode's first real finding was a bug it caught, now fixed: the traced diffuse estimate was missing
# the (1 - metallic) the lighting stage's ambient carries, so a metallic surface was granted a diffuse
# indirect the lighting stage never adds (measured +1.75 of mean brightness at ssgi_radius 0, and
# +1.4005 on a convex metallic scene, which now reads -0.0001).
furnace = false
# MEASURED, against a CONVERGED SHADED ESTIMATOR (16 rays per pixel, the knob's limit, over 600 frames of
# a static camera, accumulated by the temporal resolve - the same instrument as the tertile tables, now
# per pixel instead of per region): a 2-ray frame of the shaded path differs from it by MAE 0.42 / RMSE 0.76
# (green channel, 8-bit), while a 2-ray frame of the SCREEN path differs from it by MAE 1.55 / RMSE 3.04 -
# four times the RMSE, and its worst pixel is off by 46 against the shaded path's 14.
# READ THAT CAREFULLY, because it is not the ground-truth comparison it looks like: the reference is the
# shaded estimator itself, so "the shaded path is closer to the shaded estimator" is close to a tautology.
# What the numbers do establish is a split. The shaded path's 0.42 is its own NOISE (how far a 2-ray frame
# is from its own converged limit - small, so the shading is stable and the denoiser handles it), and the
# screen path's 1.55 is a MODEL difference (sampling the screen's direct radiance and falling back to a
# probe is answering a different question, not a noisier version of the same one). Which of the two models
# is closer to the TRUTH still needs a reference that is neither of them - a brute-force or path-traced
# answer - and that is the open half of this step rather than something these numbers settle.

# rt_shadows: ray-traced sun shadows. One ray per pixel against the scene's acceleration structures,
# which is what makes contact shadows, cascade seams and the resolution limit of a shadow map go away -
# and what removes the "all or nothing" bias tuning a depth map needs. It is granted only on a device
# with ray queries (`VK_KHR_acceleration_structure` + `VK_KHR_ray_query`); everywhere else the key is
# ignored and the cascaded maps run, so it is safe to leave in a shared config.
#
# Turning this on builds the scene's acceleration structures and traces the sun with them. Measured on
# Sponza at 1080x960 (the per-pass GPU timings, the "rt" and "rt shadow" intervals): the bottom levels are
# built once (103 structures, 262k triangles, 17.8 MiB, ~2 ms host), the top level is rebuilt every frame
# from the culled caster list (103 instances, 0.09-0.14 ms), and the rays themselves cost 1.06-1.22 ms per
# frame - so the frame goes from ~0.9 ms to ~2.4 ms. That is the honest price of the feature and the
# reason it is opt-in: the cascaded path is nearly free here (~0 ms) because a static scene REUSES its
# shadow maps (M9), while a ray has to re-answer the question every frame.
#
# What it buys is shadow detail a cascade map cannot represent: against the cascade path the frame differs
# by 4.56/255 on average, and the differences are thin bands on shadow edges - a hard ray against hardware
# PCF - plus the crenellated parapet's shadow on the upper wall, where the 2048 map smears the merlons
# into one band (raising the map to 8192 only sharpens the band; the ray resolves each merlon, verified by
# comparing the three side by side).
#
# Two limits come with it, one of which the next key removes: a MASK surface is SOLID to a ray (an inline
# ray query has no any-hit shader to run the material's discard) unless `rt_mask_bake` is on, and a skinned
# or morphed mesh casts its BIND POSE (the deformation happens in the vertex shader and never reaches the
# memory a build reads).
# NOTE on ssgi_intensity with ssgi_ray_tracing = true: the traced pass is no longer an ADDITION to the
# probe - its rays fall back to the probe off screen, and the lighting stage stops adding its own
# diffuse ambient so the two are not counted twice. The intensity therefore multiplies the WHOLE
# diffuse ambient on such a frame, and 1.0 is the value that means 'use the traced estimate'. 0.7
# dims the ambient to 70%, and 4.0 over-brightens it four times. SSAO also stops scaling the diffuse
# ambient then, because the traced rays answer the occlusion question with real geometry instead.
rt_shadows = false
# rt_mask_bake: bake alphaMode MASK into the acceleration structures, so a masked surface is not SOLID to a
# ray. A compute pass (`shaders/mask_bake.comp`) samples the material's alpha over each triangle of masked
# geometry and COLLAPSES the triangles the mask covers nowhere - all three of their vertices written at one
# position, which is a triangle no traversal can report a hit against. Hiding a triangle that way is only
# safe if it owns its vertices, so the geometry is expanded to three unique vertices per triangle, made
# non-indexed, written into a buffer of its own, and the structures and the hit shading read that copy.
# OFF BY DEFAULT, AND THE MEASUREMENT IS WHY - this is an instrument, not a fix that worked. The plumbing is
# verified (baking with the rule disabled is byte-identical to not baking at all: the expansion, the
# non-indexed build and the instance table are all exact), but the RULE is a per-triangle decision standing
# in for a per-fragment one, and on a MASK-heavy sample asset it disagrees with the raster path in the
# expensive direction: the traced frame came out 1.29 of mean brightness BRIGHTER than the raster shadow it
# should match, i.e. triangles the raster path still shadows (through its own filtered texel sampling) were
# removed from the structure. The rule samples every texel of a triangle's UV footprint and keeps anything
# it cannot walk, so it does not remove geometry it has not looked at - what it cannot do is reproduce a
# PER-PIXEL mask, which is exactly the limitation the mechanism has and the reason a better answer needs a
# different mechanism (subdividing along the mask boundary, or the opacity-micromap extension).
# A no-op without `rt_shadows` and without a traced GI frame: no structures, no bake, byte-identical.
rt_mask_bake = false

# fxaa: anti-alias the final image (one extra fullscreen pass over the tonemapped LDR image).
# Cheap and hardware-independent, but it is a screen-space blur of edges: it softens fine detail and
# cannot remove sub-pixel shimmer in motion. Its two knobs (sub-pixel strength, edge threshold) live
# in the debug overlay, not here.
# unlit: render mode. true draws every surface as its flat base color (factor x albedo texture), with
# no direct light, shadows, IBL, AO or emissive - a shading-free reference against the lit pass, and
# useful for assets whose authored data is minimal. It is the "render mode" combo of the debug overlay
# as a startup setting: the lighting stage is told explicitly (set_unlit) and then writes the stored
# albedo instead of shading it, because it binds its own pipeline and cannot follow a per-leaf switch.
unlit = false

fxaa = false

# gpu_timings: measure how long each pass takes on the GPU (timestamp queries). The frame writes a
# timestamp at every pass boundary, the values are read back once the frame slot completed and
# averaged over a 60-frame window: the report goes to the log and to the debug overlay, which is
# what the renderer's performance work is steered by. Leave it on - the cost is a handful of query
# writes per frame - and turn it off only for a measurement-free profile run. A device whose queue
# cannot write timestamps reports "unavailable" and everything else works unchanged.
gpu_timings = true

# gbuffer_debug / gbuffer_channel: the G-buffer, shown instead of the shaded scene.
# The opaque pass stores the surface (albedo/metallic, world normal/roughness, material id/AO/flags)
# into three single-sampled targets and a fullscreen pass displays one channel of it through the
# ordinary post chain. It is the inspection tool for the G-buffer - a wrong normal encoding or
# a swapped roughness channel looks like "the lighting is a bit off" once the lighting stage consumed
# it, so being able to look at the raw data matters. It replaces the lighting stage while it is on,
# and it skips alpha-blended geometry, so leave it off for normal runs.
gbuffer_debug = false
# gbuffer_channel: 0 albedo, 1 world normal, 2 roughness, 3 metallic, 4 ambient occlusion, 5 material id,
#   6 depth, 7 flags, 8 motion. The last one is TAA's motion vector, amplified (four pixels of motion
#   saturate) and biased so that "did not move" is flat olive: it answers where reprojection is being
#   asked to move a sample and which way, which a shaded screenshot cannot show.

# taa: temporal anti-aliasing. The projection is jittered by a Halton(2,3) sequence every frame, the
# G-buffer carries motion vectors, and a fullscreen resolve blends the current frame with a
# reprojected, neighborhood-clamped history into the HDR target the post chain reads. It removes what
# no edge filter can: sub-pixel shimmer in motion. There is no MSAA to fall back on - a G-buffer cannot
# be multisampled without per-sample shading - so this is the engine's anti-aliasing.
# The two weights are history (previous frames) weights: `taa_blend_static` for pixels that did not
# move (0.9 = 10% of the new frame per frame: higher is smoother but slower to react to lighting
# changes) and `taa_blend_min` once a pixel moves a pixel or more (lower trusts the current frame
# more, trading smoothing for less ghosting). Both live in the overlay as sliders too.
taa = false
taa_blend_static = 0.9
taa_blend_min = 0.5

# validation_layers: Vulkan validation layers + debug messenger (VK_LAYER_KHRONOS_validation).
# Debug builds default to true, Release builds to false; override per build as needed (e.g.
# turn it on in a Release build when tracking a problem, or off in Debug for raw speed).
validation_layers = true

# ---- [gui] debug overlay ----
[gui]
show = true   # show the Dear ImGui debug overlay by default (F1 toggles it at runtime)
# Default debug-panel window size (0 = ImGui auto-size). It only applies on FIRST use:
# a later drag - persisted in imgui_layout.ini next to the working directory - overrides it
# (delete that file to get these values back). 560 is tall enough that the render-path
# controls are visible without scrolling; the panel only offers the controls that can actually do
# something this session (TAA/SSAO appear once the G-buffer pipelines exist, the FXAA knobs
# once FXAA is on, ...) and says why in the log when something cannot run.
panel_width  = 420
panel_height = 560

# ---- [lighting] IBL precompute resolutions ----
# Lower values speed up startup (fewer pixels precomputed); higher values improve
# ambient / reflection quality.
[lighting]
env_size      = 256   # base environment cubemap size
env_mip_count = 5     # prefiltered environment mip chain length
irr_size      = 32    # irradiance cubemap size
lut_size      = 256   # BRDF LUT size

# demo_lights: spawn this many procedural punctual lights on a helix around the scene bounds (cycling
# colors, finite range) - the clustered-light stress mode. The debug overlay only edits four light
# slots, and with four lights the cluster lists and the brute-force loop visit the same handful, so
# the clustering win is invisible; this is what makes it measurable. They are pushed every frame
# together with the overlay slots (which take priority if the two together would overflow the light
# array). 0 = overlay lights only.
demo_lights = 0
