# ============================================================
# vulkan_render startup configuration (example)
# ------------------------------------------------------------
# Copy this file to config.toml (in the working directory, or anywhere
# and point to it with --config <path>), then adjust as needed.
#
#   cp config.example.toml config.toml
#   vulkan_render                    # reads config.toml
#   vulkan_render --config my.toml   # reads the given file
#   vulkan_render <model>            # argv overrides the file entries
#
# Note: backslashes are escapes in TOML strings, so use forward slashes
# for Windows paths ("C:/...") or double backslashes ("C:\\...").
# ============================================================

# ---- top level: model to load ----
# model: glTF/GLB file to load. When empty, tries DamagedHelmet.gltf under
#   paths.model_dir, then auto-locates gltf_model/ upward from the cwd.
model = "gltf_model/DamagedHelmet.gltf"

# grid_side: when > 1, lays the first pbr model out as a grid_side x grid_side
#   instanced grid (single instanced draw call stress test; 0 = off)
grid_side = 0

# ---- [paths] resource directories (empty = auto-locate) ----
[paths]
# shaders_dir: shader SPIR-V directory. Empty = find "shaders/" upward from cwd.
shaders_dir = ""

# model_dir: default model directory used when model is empty (looks for
#   DamagedHelmet.gltf inside). Empty = auto-locate "gltf_model/" upward.
model_dir = ""

# screenshot_dir: base directory for F12 screenshots (created on demand).
#   Empty = the current working directory.
screenshot_dir = ""

# ---- [render] window / presentation ----
[render]
# Initial window size in pixels; the window is resizable, resizing rebuilds the
# swapchain automatically.
window_width  = 1080
window_height = 960

# Window title (static; fps is shown in the ImGui overlay when gui is enabled).
window_title = "vulkan_render"

# vsync: true = prefer FIFO_LATEST_READY (vsync-locked, never tears, and the acquire blocks instead of
# spinning, so an idle window stays off the CPU; falls back to FIFO where that extension is missing).
# false = prefer Mailbox, which presents as fast as the app can render: that is the mode to measure
# throughput in, because with vsync the presented rate is the display's refresh rate and only the
# per-pass CPU/GPU timing lines say anything about the renderer.
vsync = true
# max_fps: cap the render loop. 0 = uncapped, which is what a throughput (fps) measurement needs -
# with vsync on the displayed rate is the refresh rate either way, but the loop still runs flat out and
# burns a core, so a desktop build usually wants something like the display's refresh rate here while a
# benchmark wants 0. Capture runs (--capture-frames) also want 0.
max_fps = 0

# msaa: multisample count. 0 = auto (device max usable, usually 4 or 8);
#   or a fixed 2/4/8/...; clamped to the device max when unsupported.
msaa = 0

# clear_color: per-frame background clear color (RGB, 0..1). The skybox is drawn
#   over it, so it only shows where the environment pass leaves the background.
clear_color = [0.02, 0.02, 0.03]


# shadow: record the directional shadow pass each frame (false = no shadows, fully lit)
shadow = true

# shadow_cascades: how many cascaded shadow maps the sun uses (1..4). One map cannot be dense enough
# for both the near range and the far one: a single 2048^2 map fitted to a whole scene gives every
# receiver the same texel size, so with the box fitted to the camera view the pixels close to the
# camera get the same coarse texels as the ones far away. The fitted view range is split into this
# many slices (practical split scheme, lambda 0.75), each cascade gets the same map resolution over a
# much smaller footprint, and the fragment shader picks its cascade per pixel from the view depth
# (blending across the boundary over `shadow_cascade_blend` of the range - a hard switch shows the
# resolution step as a line). 1 = exactly the historic single-map behavior; 3 is the default balance,
# 4 spends the sharpest near range on 4x the shadow memory (the map is a 4-layer array whatever this
# says - a runtime-selectable count needs the layers to exist up front). Applied before the scene
# import: the layered image is created when the first scene set binds it.
shadow_cascades = 3

# shadow_map_size: the shadow map's edge length in texels (256..8192, rounded to a power of two).
# 2048 is the default: the layered map is shadow_map_size^2 x 4 cascade layers x 4 bytes per frame
# slot, so 2048 costs 64 MB per slot and 4096 would cost 256 MB - and the depth pass scans that many
# texels per cascade per frame. Halving it quarters both and doubles the shadow texel size (a softer,
# more aliased edge); `[render] shadow_cascades` is usually the better knob to spend resolution on.
# STARTUP-ONLY, like the cascade count: the image, its per-layer views and the descriptor are created
# when the first scene set binds them, so this must apply before the scene import.
shadow_map_size = 2048

# shadow_cascade_blend: fraction of a cascade's range over which it fades into the next one
# (0.1 = the last 10% of the range). 0 = a hard switch.
shadow_cascade_blend = 0.1

# clustered_lights: sort the punctual lights into a screen-tile x depth-slice grid once per frame (a
# compute pass, shaders/light_cluster.comp) and evaluate only the pixel own cluster list instead of
# every active light. This is what makes a light count far past the old four affordable: measured on
# Sponza with 64 procedural lights at 960x720, the shading pass drops from 1.28 ms to 0.44 ms (and the
# same change measured 0.25 ms to 0.08 ms in the pre-M5 forward path), with a byte-identical image.
# false = the brute-force loop over every active light (the reference path the clustered one is
# verified against). The grid is 64 px tiles x 16 exponential depth slices, 32 lights per cluster;
# a cluster that overflows drops the extra lights (raise vulkan::cluster_light_capacity if a scene
# ever needs more - the capacity and the light array size are the two knobs).
clustered_lights = true

# ssao / ssao_radius / ssao_intensity / ssao_samples: screen-space ambient occlusion (M6). The
# lighting stage traces a golden-angle hemisphere of samples around each pixel
# against the G-buffer depth and folds the occlusion into the shade_input ao, which is exactly what a
# material baked AO map does: it scales the IBL ambient (diffuse and specular) and never the direct
# sun. No extra pass and no extra render target - the depth and normals it needs are the G-buffer the
# lighting stage already reads. The radius is in WORLD units, so its apparent strength depends on how
# close the camera is: 0.5 suits human-scale contact AO, while Sponza seen from 50 units away needs
# 1..2 to read (that distance dependence is inherent to screen-space AO, not a tuning mistake), and
# `ssao_samples` trades cost for smoothness (1..16, the shader maximum). `ssao = false` (or an
# intensity of 0) makes the term return exactly 1.0, so the frame is bit for bit the pre-M6 frame.
ssao = true
ssao_radius = 0.5
ssao_intensity = 1.0
ssao_samples = 8

# fxaa: anti-alias the final image (one extra fullscreen pass over the tonemapped LDR image).
# Cheap and hardware-independent, but it is a screen-space blur of edges: it softens fine detail and
# cannot remove sub-pixel shimmer in motion. Its two knobs (sub-pixel strength, edge threshold) live
# in the debug overlay, not here.
# unlit: render mode. true draws every surface as its flat base color (factor x albedo texture), with
# no direct light, shadows, IBL, AO or emissive - a shading-free reference against the lit pass, and
# useful for assets whose authored data is minimal. It is the "render mode" combo of the debug overlay
# as a startup setting: the lighting stage is told explicitly (set_unlit) and then writes the stored
# albedo instead of shading it, because it binds its own pipeline and cannot follow a per-leaf switch.
unlit = false

fxaa = false

# gpu_timings: measure how long each pass takes on the GPU (timestamp queries). The frame writes a
# timestamp at every pass boundary, the values are read back once the frame slot completed and
# averaged over a 60-frame window: the report goes to the log and to the debug overlay, which is
# what the renderer's performance work is steered by. Leave it on - the cost is a handful of query
# writes per frame - and turn it off only for a measurement-free profile run. A device whose queue
# cannot write timestamps reports "unavailable" and everything else works unchanged.
gpu_timings = true

# gbuffer_debug / gbuffer_channel: the G-buffer, shown instead of the shaded scene.
# The opaque pass stores the surface (albedo/metallic, world normal/roughness, material id/AO/flags)
# into three single-sampled targets and a fullscreen pass displays one channel of it through the
# ordinary post chain. It is the inspection tool for the G-buffer - a wrong normal encoding or
# a swapped roughness channel looks like "the lighting is a bit off" once the lighting stage consumed
# it, so being able to look at the raw data matters. It replaces the lighting stage while it is on,
# and it skips alpha-blended geometry, so leave it off for normal runs.
gbuffer_debug = false
# gbuffer_channel: 0 albedo, 1 world normal, 2 roughness, 3 metallic, 4 ambient occlusion, 5 material id, 6 depth, 7 flags

# taa: temporal anti-aliasing. The projection is jittered by a Halton(2,3) sequence every frame, the
# G-buffer carries motion vectors, and a fullscreen resolve blends the current frame with a
# reprojected, neighborhood-clamped history into the HDR target the post chain reads. It removes what
# no edge filter can: sub-pixel shimmer in motion. There is no MSAA to fall back on - a G-buffer cannot
# be multisampled without per-sample shading - so this is the engine's anti-aliasing.
# The two weights are history (previous frames) weights: `taa_blend_static` for pixels that did not
# move (0.9 = 10% of the new frame per frame: higher is smoother but slower to react to lighting
# changes) and `taa_blend_min` once a pixel moves a pixel or more (lower trusts the current frame
# more, trading smoothing for less ghosting). Both live in the overlay as sliders too.
taa = false
taa_blend_static = 0.9
taa_blend_min = 0.5

# validation_layers: Vulkan validation layers + debug messenger (VK_LAYER_KHRONOS_validation).
# Debug builds default to true, Release builds to false; override per build as needed (e.g.
# turn it on in a Release build when tracking a problem, or off in Debug for raw speed).
validation_layers = true

# ---- [gui] debug overlay ----
[gui]
show = true   # show the Dear ImGui debug overlay by default (F1 toggles it at runtime)
# Default debug-panel window size (0 = ImGui auto-size). It only applies on FIRST use:
# a later drag - persisted in imgui_layout.ini next to the working directory - overrides it
# (delete that file to get these values back). 560 is tall enough that the render-path
# controls are visible without scrolling; the panel only offers the controls that can actually do
# something this session (TAA/SSAO appear once the G-buffer pipelines exist, the FXAA knobs
# once FXAA is on, ...) and says why in the log when something cannot run.
panel_width  = 420
panel_height = 560

# ---- [lighting] IBL precompute resolutions ----
# Lower values speed up startup (fewer pixels precomputed); higher values improve
# ambient / reflection quality.
[lighting]
env_size      = 256   # base environment cubemap size
env_mip_count = 5     # prefiltered environment mip chain length
irr_size      = 32    # irradiance cubemap size
lut_size      = 256   # BRDF LUT size

# demo_lights: spawn this many procedural punctual lights on a helix around the scene bounds (cycling
# colors, finite range) - the clustered-light stress mode. The debug overlay only edits four light
# slots, and with four lights the cluster lists and the brute-force loop visit the same handful, so
# the clustering win is invisible; this is what makes it measurable. They are pushed every frame
# together with the overlay slots (which take priority if the two together would overflow the light
# array). 0 = overlay lights only.
demo_lights = 0
