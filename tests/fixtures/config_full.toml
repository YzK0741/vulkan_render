# config consumed by the app_config unit tests (tests/test_app_config.cpp).
# Keys deliberately cover every settings struct so a wrong parse/merge shows up.
model = "Models/tri.gltf"

[paths]
shaders_dir = "shaders"
screenshot_dir = "captures"

[render]
window_width = 800
window_height = 600
window_title = "vk_test"
vsync = true
msaa = 8
clear_color = [0.1, 0.2, 0.3]
skybox = false
shadow = false
fxaa = true
gpu_timings = false
gbuffer_debug = true
gbuffer_channel = 5
deferred = true
taa = true
taa_blend_static = 0.8
taa_blend_min = 0.2
validation_layers = false

[lighting]
env_size = 128
env_mip_count = 5
irr_size = 64
lut_size = 128

[gui]
show = false
panel_width = 320
panel_height = 200
