# config consumed by the app_config unit tests (tests/test_app_config.cpp).
# Keys deliberately cover every settings struct so a wrong parse/merge shows up.
model = "Models/tri.gltf"

[paths]
shaders_dir = "shaders"
screenshot_dir = "captures"

[render]
window_width = 800
window_height = 600
window_title = "vk_test"
vsync = true
clear_color = [0.1, 0.2, 0.3]
shadow = false
shadow_cascades = 2
shadow_map_size = 1024
shadow_cascade_blend = 0.25
clustered_lights = false
ssao = false
ssao_radius = 1.5
ssao_intensity = 0.5
ssao_samples = 4
# ZZZ-style NPR, every one of them at a NON-DEFAULT value: this fixture is what proves the parser READS
# these four keys (the generated-defaults fixture cannot, because three of its values are neutral).
exposure = 0.75
sun_intensity = 0.8
toon_steps = 5
toon_softness = 0.05
toon_shadow_tint = [0.55, 0.5, 0.75]
toon_rim = 0.8
toon_shadow_band = 0.15
toon_specular = 0.9
toon_shadow_band_gain = 0.4
# the outline, at non-default values too (the generated-defaults fixture's colour is black = the compiled
# default, so only this fixture can prove the two keys are read back)
outline_color = [0.1, 0.05, 0.2]
outline_width = 0.06
rt_shadows = true
rt_mask_bake = false
rt_skin_bake = true
animation_time = 0.75
furnace = true
unlit = true
fxaa = true
gpu_timings = false
gbuffer_debug = true
gbuffer_channel = 5
taa = true
taa_blend_static = 0.8
taa_blend_min = 0.2
validation_layers = false

[lighting]
env_size = 128
env_mip_count = 5
irr_size = 64
lut_size = 128
demo_lights = 3

[gui]
show = false
panel_width = 320
panel_height = 200
