# ============================================================
# vulkan_render startup configuration (generated by
#   scripts/make_config.py)
# ============================================================
#
# TEST FIXTURE - a verbatim copy of what `python scripts/make_config.py` writes when every question
# is answered with its default. It exists because the generator and the parser drifted apart once:
# the generator silently omitted eleven [render] keys app_config understood, and its env_mip_count
# range included a value the loader now rejects. test_app_config.cpp::test_generated_config_parses
# reads THIS file, so regenerating the fixture is what proves the two still agree.

# ---- top level: model to load ----
model = "gltf_model/DamagedHelmet.gltf"

grid_side = 0

# ---- [paths] resource directories (empty = auto-locate) ----
[paths]
shaders_dir = ""
model_dir = ""

# ---- [render] window / presentation ----
[render]
window_width = 1080
window_height = 960
window_title = "vulkan_render"
vsync = false
max_fps = 240
msaa = 8
clear_color = [0.02, 0.02, 0.03]
shadow = true
validation_layers = true

# ---- [render] shadow mapping ----
shadow_cascades = 3
shadow_map_size = 2048
shadow_cascade_blend = 0.1

# ---- [render] shading + post-processing features ----
unlit = false
taa = true
taa_blend_static = 0.9
taa_blend_min = 0.5
fxaa = true
gbuffer_debug = false
gbuffer_channel = 1
gpu_timings = true

# ---- [render] punctual lights + screen-space AO ----
clustered_lights = true
ssao = true
ssao_radius = 0.5
ssao_intensity = 1.0
ssao_samples = 8

# ---- [gui] debug overlay ----
[gui]
show = true
panel_width = 380
panel_height = 140

# ---- [lighting] IBL precompute resolutions ----
[lighting]
env_size = 256
env_mip_count = 5
irr_size = 32
lut_size = 256
