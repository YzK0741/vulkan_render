name: ci

# Build + headless tests on every push to master and every pull request.
#
# Why MSYS2 clang64: the project is C++23 modules on clang + libc++, and the
# STL module (vstd/vstd.cppm, a trimmed fork of the generated libc++ std module)
# is tied to that toolchain - the only environment that guarantees a
# byte-compatible libc++ is the same MSYS2 clang64 the project is developed in. The headless unit tests
# (tests/, ctest) run on the CPU-only modules; the Release build of the full
# project (including the Vulkan executable) is the compile gate. No GPU is
# needed - nothing is executed that requires a Vulkan device.
#
# Gates in one job (they share the MSYS2 install): Release build + ctest,
# a Debug build (assert-enabled compile gate - catches paths Release skips),
# and clang-tidy over the pure-CPU modules (app_config + utility), which is
# kept warning-free so --warnings-as-errors fails on any regression.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    name: Release build + ctest + Debug gate + clang-tidy
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - name: Set up MSYS2 (clang64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: clang64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-clang-tools-extra
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-libc++
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-glfw
            mingw-w64-clang-x86_64-glm
            mingw-w64-clang-x86_64-tomlplusplus
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-headers

      - name: Configure (Release, Ninja)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build all targets (incl. tests + vulkan_render.exe)
        run: cmake --build build

      - name: Run headless unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Configure (Debug, Ninja)
        run: cmake -S . -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build all targets (Debug compile gate)
        run: cmake --build build-debug

      - name: clang-tidy (pure-CPU modules, warnings are errors)
        run: >-
          clang-tidy -p build --warnings-as-errors='*'
          app_config/app_config.cppm app_config/app_config.cpp
          utility/data_block.cppm utility/utility.cppm utility/utility.cpp
          utility/thread_pool/thread_pool.cppm utility/thread_pool/thread_pool.cpp
          utility/BVH/bvh.cppm utility/BVH/bvh.cpp
          utility/frame_clock/frame_clock.cppm
          utility/frame_stats/frame_stats.cppm
          utility/better_pmr/better_pmr.cppm

      - name: Upload the Release executable
        uses: actions/upload-artifact@v5
        with:
          name: vulkan_render-windows-x64
          path: build/vulkan_render.exe
          if-no-files-found: error

  sanitizers:
    name: ASan + UBSan (headless tests)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - name: Set up MSYS2 (clang64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: clang64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-compiler-rt
            mingw-w64-clang-x86_64-libc++
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-glm
            mingw-w64-clang-x86_64-tomlplusplus
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-headers

      # AddressSanitizer + UndefinedBehaviorSanitizer over the headless CPU tests.
      #
      # A separate job rather than another gate in build-and-test: this build cannot be shared with
      # the optimized one (sanitizers need instrumentation and must not be LTO'd), and keeping it
      # apart means a sanitizer finding does not hide the Release/Debug/clang-tidy result.
      #
      # Only the test targets are built. The executable needs a Vulkan SDK that is not installed
      # here, and it is the one artifact this job must NOT produce: its dependencies (glfw,
      # vulkan-loader) are not present, so a full `all` build would fail on the link rather than on
      # anything the sanitizers have to say.
      #
      # Why this gate earns its place: the whole test suite is pure CPU with no GPU anywhere, so
      # memory errors in the loader / utility / config paths are invisible to the Release run. The
      # glTF reader's non-float-attribute bug is the worked example - four assertions deep in the
      # vertex builder passed in Release while ASan reported
      # "READ of size 8 ... 0 bytes after 6-byte region" on the same code.
      - name: Configure (Debug + ASan + UBSan)
        run: >-
          cmake -S . -B build-asan -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DVR_BUILD_TESTS=ON

      - name: Build the headless tests
        run: >-
          cmake --build build-asan --target
          test_app_config test_utility test_math test_animation test_gltf_loader

      - name: Run the headless tests under the sanitizers
        # ASAN_OPTIONS/UBSAN_OPTIONS: halt on the first finding and print a stack trace, so a report
        # fails the job instead of scrolling past. Two deliberate omissions:
        #   - `detect_leaks` is NOT set: LeakSanitizer does not exist on Windows and passing the
        #     option makes EVERY run abort with "detect_leaks is not supported on this platform"
        #     (measured here - a CI job carrying it would go red on all five tests, reporting the
        #     flag rather than a bug). It is off by default on this platform anyway.
        #   - `abort_on_error` stays 0, so a finding produces a non-zero exit code from the test
        #     binary (which is what ctest reads) rather than a crash dump.
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-asan --output-on-failure

